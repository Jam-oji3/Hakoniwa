[workspace]
members = [
    "crates/hakoniwa-domain",
    "crates/hakoniwa-application",
    "crates/hakoniwa-infrastructure",
    "crates/hakoniwa-presentation",
    "crates/hakoniwa-app",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
